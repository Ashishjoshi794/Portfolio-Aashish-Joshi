<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="hpBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050a18"/>
      <stop offset="100%" stop-color="#0c1731"/>
    </linearGradient>
    <linearGradient id="regGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="hpGlow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#hpBg)"/>

  <!-- Grid lines -->
  <g stroke="rgba(255,255,255,0.05)" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
  </g>

  <!-- Title Pill Header -->
  <g transform="translate(60, 45)">
    <rect width="280" height="34" rx="8" fill="#030712" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="20" cy="17" r="5" fill="#38bdf8" filter="url(#hpGlow)"/>
    <text x="36" y="22" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="1">AMES HOUSING REGRESSION</text>
  </g>

  <!-- Left: Regression Scatter Plot & Trend Line -->
  <g transform="translate(60, 110)">
    <rect width="380" height="330" rx="16" fill="#030712" fill-opacity="0.75" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
    
    <text x="24" y="38" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700" fill="#f8fafc">Actual vs. Predicted Selling Price</text>
    <text x="24" y="58" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94a3b8">Supervised Regression • Extra Trees Model</text>

    <!-- Axes -->
    <g stroke="rgba(255,255,255,0.2)" stroke-width="1.5">
      <line x1="45" y1="265" x2="345" y2="265"/>
      <line x1="45" y1="265" x2="45" y2="85"/>
    </g>

    <!-- Grid inside plot -->
    <g stroke="rgba(255,255,255,0.05)" stroke-width="1" stroke-dasharray="3 3">
      <line x1="45" y1="205" x2="345" y2="205"/>
      <line x1="45" y1="145" x2="345" y2="145"/>
      <line x1="45" y1="85" x2="345" y2="85"/>
      <line x1="145" y1="265" x2="145" y2="85"/>
      <line x1="245" y1="265" x2="245" y2="85"/>
      <line x1="345" y1="265" x2="345" y2="85"/>
    </g>

    <!-- Regression Best-Fit Line -->
    <line x1="55" y1="250" x2="330" y2="95" stroke="url(#regGrad)" stroke-width="3" filter="url(#hpGlow)"/>

    <!-- Data Points Scattered around line -->
    <g fill="#38bdf8" fill-opacity="0.8">
      <circle cx="70" cy="245" r="3.5"/>
      <circle cx="95" cy="225" r="4"/>
      <circle cx="110" cy="235" r="3.5"/>
      <circle cx="130" cy="205" r="4"/>
      <circle cx="145" cy="195" r="4"/>
      <circle cx="160" cy="210" r="3"/>
      <circle cx="180" cy="175" r="4.5"/>
      <circle cx="205" cy="160" r="4"/>
      <circle cx="220" cy="170" r="3.5"/>
      <circle cx="235" cy="145" r="4"/>
      <circle cx="250" cy="130" r="4.5"/>
      <circle cx="270" cy="140" r="3.5"/>
      <circle cx="285" cy="115" r="4"/>
      <circle cx="310" cy="105" r="4.5"/>
    </g>

    <text x="50" y="295" font-family="'Segoe UI', sans-serif" font-size="10" fill="#64748b">Living Area / Overall Qual (Features)</text>
    <text x="240" y="295" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" fill="#38bdf8">SalePrice ($)</text>
  </g>

  <!-- Right: Architecture & Metric Badge Panel -->
  <g transform="translate(470, 110)">
    <rect width="270" height="330" rx="16" fill="#030712" fill-opacity="0.85" stroke="#818cf8" stroke-width="1.5" stroke-opacity="0.4"/>

    <!-- Top Architecture Badge -->
    <g transform="translate(20, 20)">
      <rect width="180" height="28" rx="6" fill="#6366f1" fill-opacity="0.15" stroke="#6366f1" stroke-width="1"/>
      <text x="12" y="19" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" fill="#a5b4fc">EXTRA TREES REGRESSOR</text>
    </g>

    <!-- Model Comparison Highlights -->
    <g transform="translate(20, 68)">
      <rect width="230" height="85" rx="12" fill="#0b1329" stroke="rgba(255,255,255,0.08)"/>
      <text x="14" y="24" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94a3b8">Evaluated Metrics</text>
      <text x="14" y="52" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="800" fill="#38bdf8">RMSE • MAE • R²</text>
      <text x="14" y="72" font-family="'Segoe UI', sans-serif" font-size="11" fill="#64748b">Cross-Validated Tuning</text>
    </g>

    <!-- Streamlit Deployment -->
    <g transform="translate(20, 172)">
      <rect width="230" height="75" rx="12" fill="#0b1329" stroke="rgba(255,255,255,0.08)"/>
      <text x="14" y="24" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94a3b8">Web Application</text>
      <text x="14" y="50" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700" fill="#e2e8f0">Streamlit Interactive UI</text>
      <text x="14" y="68" font-family="'Segoe UI', sans-serif" font-size="10" fill="#10b981">Real-time Valuation Input</text>
    </g>

    <!-- Pipeline steps -->
    <g transform="translate(20, 268)">
      <text x="0" y="10" font-family="'Space Grotesk', sans-serif" font-size="10" fill="#94a3b8">Preprocessing • Encoding • Evaluation</text>
      <rect y="20" width="230" height="24" rx="6" fill="#1e293b"/>
      <text x="12" y="36" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="600" fill="#38bdf8">github.com/Ashishjoshi794</text>
    </g>
  </g>
</svg>
