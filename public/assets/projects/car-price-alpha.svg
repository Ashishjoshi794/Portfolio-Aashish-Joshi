<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="cpBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09101d"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="cpGlow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#cpBg)"/>

  <!-- Grid lines -->
  <g stroke="rgba(255,255,255,0.05)" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
  </g>

  <!-- Title Pill Header -->
  <g transform="translate(60, 45)">
    <rect width="280" height="34" rx="8" fill="#030712" stroke="#f59e0b" stroke-width="1.5"/>
    <circle cx="20" cy="17" r="5" fill="#f59e0b" filter="url(#cpGlow)"/>
    <text x="36" y="22" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700" fill="#fbbf24" letter-spacing="1">CAR PRICE REGRESSION (TASK 3)</text>
  </g>

  <!-- Left: Automotive Specifications & Feature Correlation -->
  <g transform="translate(60, 110)">
    <rect width="380" height="330" rx="16" fill="#030712" fill-opacity="0.8" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
    
    <text x="24" y="36" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700" fill="#f8fafc">Vehicle Valuation Feature Engine</text>
    <text x="24" y="56" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94a3b8">car data.csv • Horsepower, Mileage, Brand Goodwill</text>

    <!-- Feature Correlation Bars -->
    <g transform="translate(24, 85)">
      <!-- Year / Depreciation -->
      <text x="0" y="14" font-family="'Segoe UI', sans-serif" font-size="11" fill="#cbd5e1">Manufacturing Year</text>
      <rect x="130" y="2" width="180" height="16" rx="4" fill="#1e293b"/>
      <rect x="130" y="2" width="160" height="16" rx="4" fill="url(#amberGrad)"/>
      <text x="320" y="14" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="700" fill="#fcd34d">+0.88</text>

      <!-- Present Price -->
      <text x="0" y="46" font-family="'Segoe UI', sans-serif" font-size="11" fill="#cbd5e1">Showroom Price</text>
      <rect x="130" y="34" width="180" height="16" rx="4" fill="#1e293b"/>
      <rect x="130" y="34" width="150" height="16" rx="4" fill="url(#amberGrad)"/>
      <text x="320" y="46" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="700" fill="#fcd34d">+0.84</text>

      <!-- Kilometers Driven -->
      <text x="0" y="78" font-family="'Segoe UI', sans-serif" font-size="11" fill="#cbd5e1">Kms Driven (Mileage)</text>
      <rect x="130" y="66" width="180" height="16" rx="4" fill="#1e293b"/>
      <rect x="130" y="66" width="60" height="16" rx="4" fill="#ef4444"/>
      <text x="320" y="78" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="700" fill="#f87171">-0.32</text>

      <!-- Fuel Type Transmission -->
      <text x="0" y="110" font-family="'Segoe UI', sans-serif" font-size="11" fill="#cbd5e1">Fuel / Transmission</text>
      <rect x="130" y="98" width="180" height="16" rx="4" fill="#1e293b"/>
      <rect x="130" y="98" width="95" height="16" rx="4" fill="#38bdf8"/>
      <text x="320" y="110" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="700" fill="#7dd3fc">+0.54</text>
    </g>

    <!-- Stylized Car Silhouette Graphic -->
    <g transform="translate(190, 255)">
      <path d="M-90,15 L-75,-5 L-40,-15 L20,-15 L60,-5 L85,15 Z" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linejoin="round"/>
      <circle cx="-50" cy="18" r="10" fill="#030712" stroke="#fbbf24" stroke-width="2"/>
      <circle cx="50" cy="18" r="10" fill="#030712" stroke="#fbbf24" stroke-width="2"/>
      <line x1="-40" y1="18" x2="40" y2="18" stroke="#f59e0b" stroke-width="1.5"/>
    </g>
  </g>

  <!-- Right: Pipeline Details Panel -->
  <g transform="translate(470, 110)">
    <rect width="270" height="330" rx="16" fill="#030712" fill-opacity="0.85" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.4"/>

    <!-- Top Badge -->
    <g transform="translate(20, 20)">
      <rect width="180" height="28" rx="6" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1"/>
      <text x="12" y="19" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" fill="#fde68a">DATA SCIENCE TASK 3</text>
    </g>

    <g transform="translate(20, 68)">
      <rect width="230" height="80" rx="12" fill="#0b1329" stroke="rgba(255,255,255,0.08)"/>
      <text x="14" y="24" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94a3b8">Supervised Workflow</text>
      <text x="14" y="50" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="800" fill="#fbbf24">Price Regression</text>
      <text x="14" y="68" font-family="'Segoe UI', sans-serif" font-size="10" fill="#64748b">One-Hot Encoding &amp; Scaling</text>
    </g>

    <g transform="translate(20, 165)">
      <rect width="230" height="85" rx="12" fill="#0b1329" stroke="rgba(255,255,255,0.08)"/>
      <text x="14" y="24" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94a3b8">Key Libraries Used</text>
      <text x="14" y="48" font-family="'Segoe UI', sans-serif" font-size="11" fill="#e2e8f0">• Pandas &amp; Scikit-learn</text>
      <text x="14" y="66" font-family="'Segoe UI', sans-serif" font-size="11" fill="#e2e8f0">• Matplotlib Correlation Visuals</text>
    </g>

    <g transform="translate(20, 275)">
      <circle cx="6" cy="6" r="4" fill="#10b981" filter="url(#cpGlow)"/>
      <text x="18" y="10" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="600" fill="#10b981">alpha_project/data_science/TASK 3</text>
    </g>
  </g>
</svg>
