<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="cvBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d1f"/>
      <stop offset="100%" stop-color="#0e172e"/>
    </linearGradient>
    <filter id="cvGlow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#cvBg)"/>

  <!-- Grid lines -->
  <g stroke="rgba(255,255,255,0.05)" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
  </g>

  <!-- Title Pill Header -->
  <g transform="translate(60, 45)">
    <rect width="320" height="34" rx="8" fill="#030712" stroke="#a855f7" stroke-width="1.5"/>
    <circle cx="20" cy="17" r="5" fill="#a855f7" filter="url(#cvGlow)"/>
    <text x="36" y="22" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700" fill="#c084fc" letter-spacing="1">MOBILENETV2 TRANSFER LEARNING</text>
  </g>

  <!-- Left: Computer Vision Convolutional Detection Viewport -->
  <g transform="translate(60, 110)">
    <rect width="380" height="330" rx="16" fill="#030712" fill-opacity="0.8" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
    
    <text x="24" y="36" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700" fill="#f8fafc">Binary Visual Classification &amp; OOD Detector</text>
    <text x="24" y="56" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94a3b8">Kaggle Dogs vs Cats • Confidence Thresholding &lt; 70%</text>

    <!-- Visual Detection Frame with Corner Bounding Brackets -->
    <g transform="translate(40, 85)">
      <rect width="300" height="170" rx="10" fill="#070d1d" stroke="#334155" stroke-width="1"/>

      <!-- Corner reticles -->
      <path d="M20,35 L20,20 L35,20" fill="none" stroke="#a855f7" stroke-width="2"/>
      <path d="M280,35 L280,20 L265,20" fill="none" stroke="#a855f7" stroke-width="2"/>
      <path d="M20,135 L20,150 L35,150" fill="none" stroke="#a855f7" stroke-width="2"/>
      <path d="M280,135 L280,150 L265,150" fill="none" stroke="#a855f7" stroke-width="2"/>

      <!-- Stylized Cat/Dog Silhouette Wireframe -->
      <g transform="translate(150, 85)" stroke="#64748b" stroke-width="1.5" fill="none">
        <polygon points="0,-40 -20,-10 20,-10"/>
        <polygon points="-35,-25 -45,-55 -20,-30" fill="rgba(168,85,247,0.2)" stroke="#a855f7"/>
        <polygon points="35,-25 45,-55 20,-30" fill="rgba(168,85,247,0.2)" stroke="#a855f7"/>
        <circle cx="-12" cy="-18" r="3" fill="#a855f7"/>
        <circle cx="12" cy="-18" r="3" fill="#a855f7"/>
        <path d="M-8,-5 Q0,2 8,-5"/>
      </g>

      <!-- Confidence Bounding Box Tag -->
      <rect x="70" y="125" width="160" height="26" rx="6" fill="#030712" stroke="#10b981" stroke-width="1.5"/>
      <circle cx="85" cy="138" r="4" fill="#10b981"/>
      <text x="96" y="142" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" fill="#10b981">CLASS: CAT (96.8%)</text>
    </g>

    <!-- Out of Distribution Safety Badge -->
    <g transform="translate(40, 275)">
      <rect width="300" height="34" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
      <text x="14" y="21" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#c7d2fe">🛡️ OOD Safety: Flags non-pet inputs automatically</text>
    </g>
  </g>

  <!-- Right: Architecture Details Panel -->
  <g transform="translate(470, 110)">
    <rect width="270" height="330" rx="16" fill="#030712" fill-opacity="0.85" stroke="#a855f7" stroke-width="1.5" stroke-opacity="0.4"/>

    <!-- Top Badge -->
    <g transform="translate(20, 20)">
      <rect width="180" height="28" rx="6" fill="#a855f7" fill-opacity="0.15" stroke="#a855f7" stroke-width="1"/>
      <text x="12" y="19" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" fill="#d8b4fe">STREAMLIT DEPLOYED</text>
    </g>

    <g transform="translate(20, 68)">
      <rect width="230" height="80" rx="12" fill="#0b1329" stroke="rgba(255,255,255,0.08)"/>
      <text x="14" y="24" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94a3b8">Deep Learning Backbone</text>
      <text x="14" y="50" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="800" fill="#a855f7">MobileNetV2</text>
      <text x="14" y="68" font-family="'Segoe UI', sans-serif" font-size="10" fill="#64748b">Pretrained ImageNet Weights</text>
    </g>

    <g transform="translate(20, 165)">
      <rect width="230" height="85" rx="12" fill="#0b1329" stroke="rgba(255,255,255,0.08)"/>
      <text x="14" y="24" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94a3b8">Interactive App Features</text>
      <text x="14" y="48" font-family="'Segoe UI', sans-serif" font-size="11" fill="#e2e8f0">• Real-Time Image Uploads</text>
      <text x="14" y="66" font-family="'Segoe UI', sans-serif" font-size="11" fill="#e2e8f0">• Exact Confidence Scores</text>
    </g>

    <g transform="translate(20, 275)">
      <circle cx="6" cy="6" r="4" fill="#10b981" filter="url(#cvGlow)"/>
      <text x="18" y="10" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="600" fill="#10b981">Multi-page Streamlit App</text>
    </g>
  </g>
</svg>
