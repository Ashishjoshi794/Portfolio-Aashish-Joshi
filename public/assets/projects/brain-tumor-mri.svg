<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <radialGradient id="mriGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#030712"/>
    </radialGradient>
    <linearGradient id="tumorGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="500" fill="#070d1d"/>
  
  <!-- Subtle Grid -->
  <g stroke="rgba(255,255,255,0.05)" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
  </g>

  <!-- Left: Stylized Brain MRI Silhouette -->
  <g transform="translate(180, 240)">
    <!-- Skull Cranium -->
    <ellipse cx="0" cy="0" rx="140" ry="170" fill="url(#mriGlow)" stroke="#334155" stroke-width="3"/>
    <!-- Brain Hemispheres Sulci and Gyri contours -->
    <path d="M-10,-140 Q-80,-100 -70,-30 T-90,60 T-30,130 Q0,140 10,130 T70,70 T90,-20 T30,-120 Z" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="6 4"/>
    <path d="M-10,-120 Q-50,-70 -30,0 T-40,80 T0,110 T40,70 T20,-20 T10,-120" fill="none" stroke="#64748b" stroke-width="2"/>
    
    <!-- Tumor Segmentation Target (Glowing Overlay) -->
    <g filter="url(#glow)">
      <path d="M25,-40 C45,-60 85,-45 75,-15 C68,10 40,25 20,5 C5,-10 10,-25 25,-40 Z" fill="rgba(16,185,129,0.35)" stroke="#00f2fe" stroke-width="3"/>
      <circle cx="50" cy="-20" r="4" fill="#00f2fe"/>
      <circle cx="35" cy="5" r="3" fill="#10b981"/>
    </g>

    <!-- Crosshair Target -->
    <circle cx="48" cy="-18" r="45" fill="none" stroke="#00f2fe" stroke-width="1.5" stroke-dasharray="4 4"/>
    <line x1="48" y1="-70" x2="48" y2="34" stroke="#00f2fe" stroke-width="1"/>
    <line x1="-4" y1="-18" x2="100" y2="-18" stroke="#00f2fe" stroke-width="1"/>

    <!-- Callout Annotation -->
    <polyline points="75,-15 130,-70 190,-70" fill="none" stroke="#00f2fe" stroke-width="1.5"/>
    <rect x="195" y="-85" width="160" height="30" rx="6" fill="#030712" stroke="#00f2fe" stroke-width="1"/>
    <text x="275" y="-66" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700" fill="#00f2fe">LGG SEGMENTATION MASK</text>
  </g>

  <!-- Right: VGG16 + U-Net Architecture Pipeline Diagram -->
  <g transform="translate(480, 110)">
    <rect x="0" y="0" width="280" height="290" rx="16" fill="rgba(15,23,42,0.8)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    
    <text x="20" y="32" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700" fill="#f8fafc">MODEL: VGG16 + U-Net</text>
    <text x="20" y="52" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94a3b8">LGG MRI Dataset</text>

    <!-- Metrics Bars inside preview -->
    <g transform="translate(20, 80)">
      <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="11" fill="#cbd5e1">Dice Score: 0.9124</text>
      <rect x="0" y="8" width="240" height="8" rx="4" fill="#1e293b"/>
      <rect x="0" y="8" width="219" height="8" rx="4" fill="url(#tumorGlow)"/>

      <text x="0" y="40" font-family="'JetBrains Mono', monospace" font-size="11" fill="#cbd5e1">IoU Score: 0.8856</text>
      <rect x="0" y="48" width="240" height="8" rx="4" fill="#1e293b"/>
      <rect x="0" y="48" width="212" height="8" rx="4" fill="#06b6d4"/>

      <text x="0" y="80" font-family="'JetBrains Mono', monospace" font-size="11" fill="#cbd5e1">Precision: 0.9426</text>
      <rect x="0" y="88" width="240" height="8" rx="4" fill="#1e293b"/>
      <rect x="0" y="88" width="226" height="8" rx="4" fill="#8b5cf6"/>

      <text x="0" y="120" font-family="'JetBrains Mono', monospace" font-size="11" fill="#cbd5e1">Accuracy: 0.9980</text>
      <rect x="0" y="128" width="240" height="8" rx="4" fill="#1e293b"/>
      <rect x="0" y="128" width="239" height="8" rx="4" fill="#10b981"/>
    </g>

    <!-- Status pill -->
    <rect x="20" y="240" width="240" height="28" rx="14" fill="rgba(16,185,129,0.15)" stroke="#10b981" stroke-width="1"/>
    <text x="140" y="258" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" fill="#10b981">FINAL YEAR CAPSTONE VERIFIED</text>
  </g>
</svg>
