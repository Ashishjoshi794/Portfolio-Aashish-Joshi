<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="botsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050e14"/>
      <stop offset="100%" stop-color="#0b1e2e"/>
    </linearGradient>
    <filter id="botsGlow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#botsBg)"/>

  <!-- Grid lines -->
  <g stroke="rgba(255,255,255,0.05)" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
  </g>

  <!-- Title Pill Header -->
  <g transform="translate(60, 45)">
    <rect width="320" height="34" rx="8" fill="#030712" stroke="#10b981" stroke-width="1.5"/>
    <circle cx="20" cy="17" r="5" fill="#10b981" filter="url(#botsGlow)"/>
    <text x="36" y="22" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700" fill="#34d399" letter-spacing="1">MULTI-MODAL AI BOT SUITE</text>
  </g>

  <!-- Left: Multi-Modal AI Agent Topology Nodes -->
  <g transform="translate(60, 110)">
    <rect width="380" height="330" rx="16" fill="#030712" fill-opacity="0.8" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
    
    <text x="24" y="36" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700" fill="#f8fafc">Groq LLM Multi-Agent System</text>
    <text x="24" y="56" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94a3b8">Text Chat • PDF QA • Speech Recognition • Vision</text>

    <!-- Central LLM Hub -->
    <g transform="translate(190, 180)">
      <!-- Central Hub Circle -->
      <circle cx="0" cy="0" r="45" fill="#064e3b" stroke="#10b981" stroke-width="2" filter="url(#botsGlow)"/>
      <text x="0" y="-5" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="800" fill="#ecfdf5">GROQ</text>
      <text x="0" y="12" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="700" fill="#34d399">LLM CORE</text>

      <!-- Connecting Synapse Lines -->
      <line x1="-35" y1="-30" x2="-95" y2="-70" stroke="#10b981" stroke-width="1.5" stroke-dasharray="3 3"/>
      <line x1="35" y1="-30" x2="95" y2="-70" stroke="#10b981" stroke-width="1.5" stroke-dasharray="3 3"/>
      <line x1="-35" y1="30" x2="-95" y2="70" stroke="#10b981" stroke-width="1.5" stroke-dasharray="3 3"/>
      <line x1="35" y1="30" x2="95" y2="70" stroke="#10b981" stroke-width="1.5" stroke-dasharray="3 3"/>

      <!-- Node 1: Chatbot (Top Left) -->
      <g transform="translate(-105, -75)">
        <rect x="-40" y="-18" width="80" height="36" rx="8" fill="#0b1329" stroke="#38bdf8" stroke-width="1.5"/>
        <text x="0" y="4" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" fill="#7dd3fc">chatbot.py</text>
      </g>

      <!-- Node 2: PDF QA (Top Right) -->
      <g transform="translate(105, -75)">
        <rect x="-35" y="-18" width="70" height="36" rx="8" fill="#0b1329" stroke="#f59e0b" stroke-width="1.5"/>
        <text x="0" y="4" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" fill="#fcd34d">pdf.py</text>
      </g>

      <!-- Node 3: Speech Bot (Bottom Left) -->
      <g transform="translate(-105, 75)">
        <rect x="-40" y="-18" width="80" height="36" rx="8" fill="#0b1329" stroke="#ec4899" stroke-width="1.5"/>
        <text x="0" y="4" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" fill="#f472b6">speech.py</text>
      </g>

      <!-- Node 4: Image Bot (Bottom Right) -->
      <g transform="translate(105, 75)">
        <rect x="-40" y="-18" width="80" height="36" rx="8" fill="#0b1329" stroke="#a855f7" stroke-width="1.5"/>
        <text x="0" y="4" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" fill="#c084fc">image.py</text>
      </g>
    </g>

    <!-- Bottom summary tag -->
    <text x="190" y="305" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" fill="#64748b">High-speed inference without heavy frameworks</text>
  </g>

  <!-- Right: Technical Details Panel -->
  <g transform="translate(470, 110)">
    <rect width="270" height="330" rx="16" fill="#030712" fill-opacity="0.85" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.4"/>

    <!-- Top Badge -->
    <g transform="translate(20, 20)">
      <rect width="180" height="28" rx="6" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1"/>
      <text x="12" y="19" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" fill="#34d399">GROQ LLM INFERENCE</text>
    </g>

    <g transform="translate(20, 68)">
      <rect width="230" height="80" rx="12" fill="#0b1329" stroke="rgba(255,255,255,0.08)"/>
      <text x="14" y="24" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94a3b8">Language Model Engine</text>
      <text x="14" y="50" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="800" fill="#34d399">Custom Groq Wrapper</text>
      <text x="14" y="68" font-family="'Segoe UI', sans-serif" font-size="10" fill="#64748b">Direct API Client (groq-python)</text>
    </g>

    <g transform="translate(20, 165)">
      <rect width="230" height="85" rx="12" fill="#0b1329" stroke="rgba(255,255,255,0.08)"/>
      <text x="14" y="24" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94a3b8">Multi-Modal Modules</text>
      <text x="14" y="48" font-family="'Segoe UI', sans-serif" font-size="11" fill="#e2e8f0">• Conversational QA &amp; Context</text>
      <text x="14" y="66" font-family="'Segoe UI', sans-serif" font-size="11" fill="#e2e8f0">• Audio Speech &amp; Document Parsing</text>
    </g>

    <g transform="translate(20, 275)">
      <circle cx="6" cy="6" r="4" fill="#10b981" filter="url(#botsGlow)"/>
      <text x="18" y="10" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="600" fill="#10b981">github.com/Ashishjoshi794/bots</text>
    </g>
  </g>
</svg>
