<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="eaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070d1d"/>
      <stop offset="100%" stop-color="#0b1329"/>
    </linearGradient>
    <linearGradient id="cyanLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="barGrad1" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f87171"/>
    </linearGradient>
    <linearGradient id="barGrad2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="eaGlow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#eaBg)"/>

  <!-- Cyber Grid -->
  <g stroke="rgba(255,255,255,0.05)" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
  </g>

  <!-- Title Pill Header -->
  <g transform="translate(60, 45)">
    <rect width="260" height="34" rx="8" fill="#030712" stroke="#00f2fe" stroke-width="1.5"/>
    <circle cx="20" cy="17" r="5" fill="#00f2fe" filter="url(#eaGlow)"/>
    <text x="36" y="22" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700" fill="#00f2fe" letter-spacing="1">IBM HR ATTRITION DATASET</text>
  </g>

  <!-- Left: HR Analytics Bar Chart & Retention Distribution -->
  <g transform="translate(60, 110)">
    <!-- Chart Background Glass Window -->
    <rect width="360" height="330" rx="16" fill="#030712" fill-opacity="0.7" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
    
    <text x="24" y="38" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700" fill="#f8fafc">Attrition Risk by Department</text>
    <text x="24" y="58" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94a3b8">1,470 Records • 16 Extracted Predictors</text>

    <!-- Chart Grid Lines -->
    <g stroke="rgba(255,255,255,0.06)" stroke-width="1">
      <line x1="40" y1="90" x2="320" y2="90"/>
      <line x1="40" y1="140" x2="320" y2="140"/>
      <line x1="40" y1="190" x2="320" y2="190"/>
      <line x1="40" y1="240" x2="320" y2="240"/>
    </g>

    <!-- Bars for Sales, R&D, HR -->
    <!-- R&D -->
    <rect x="70" y="110" width="34" height="130" rx="4" fill="url(#barGrad2)"/>
    <rect x="110" y="195" width="34" height="45" rx="4" fill="url(#barGrad1)"/>
    <text x="107" y="262" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="11" fill="#94a3b8">R&amp;D</text>

    <!-- Sales -->
    <rect x="175" y="140" width="34" height="100" rx="4" fill="url(#barGrad2)"/>
    <rect x="215" y="175" width="34" height="65" rx="4" fill="url(#barGrad1)"/>
    <text x="212" y="262" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="11" fill="#94a3b8">Sales</text>

    <!-- HR -->
    <rect x="270" y="210" width="22" height="30" rx="4" fill="url(#barGrad2)"/>
    <rect x="296" y="218" width="22" height="22" rx="4" fill="url(#barGrad1)"/>
    <text x="294" y="262" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="11" fill="#94a3b8">HR</text>

    <!-- Legend -->
    <circle cx="90" cy="300" r="5" fill="#10b981"/>
    <text x="102" y="304" font-family="'Segoe UI', sans-serif" font-size="11" fill="#cbd5e1">Stayed (No)</text>
    <circle cx="210" cy="300" r="5" fill="#ef4444"/>
    <text x="222" y="304" font-family="'Segoe UI', sans-serif" font-size="11" fill="#cbd5e1">Attrition (Yes)</text>
  </g>

  <!-- Right: Streamlit Prediction Dashboard UI Card -->
  <g transform="translate(460, 110)">
    <rect width="280" height="330" rx="16" fill="#030712" fill-opacity="0.85" stroke="#3b82f6" stroke-width="1.5" stroke-opacity="0.4"/>
    
    <!-- Top Streamlit Badge -->
    <g transform="translate(20, 20)">
      <rect width="130" height="26" rx="6" fill="#ef4444" fill-opacity="0.15" stroke="#ef4444" stroke-width="1"/>
      <text x="10" y="17" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" fill="#f87171">STREAMLIT APP</text>
    </g>

    <!-- Prediction Gauge Card -->
    <g transform="translate(20, 65)">
      <rect width="240" height="110" rx="12" fill="#0b1329" stroke="rgba(255,255,255,0.08)"/>
      <text x="16" y="28" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94a3b8">Model Prediction Output</text>
      
      <text x="16" y="65" font-family="'Space Grotesk', sans-serif" font-size="28" font-weight="800" fill="#10b981">Low Attrition</text>
      <text x="16" y="90" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#64748b">Retention Probability: <tspan fill="#38bdf8">86.4%</tspan></text>
    </g>

    <!-- Feature Input Simulator -->
    <g transform="translate(20, 195)">
      <text x="0" y="12" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="600" fill="#94a3b8">Key Drivers Evaluated:</text>
      <g transform="translate(0, 24)">
        <rect width="112" height="28" rx="6" fill="#1e293b"/>
        <text x="10" y="18" font-family="'Segoe UI', sans-serif" font-size="10" fill="#e2e8f0">OverTime: No</text>
      </g>
      <g transform="translate(122, 24)">
        <rect width="118" height="28" rx="6" fill="#1e293b"/>
        <text x="10" y="18" font-family="'Segoe UI', sans-serif" font-size="10" fill="#e2e8f0">JobSatisfaction: 4</text>
      </g>
      <g transform="translate(0, 60)">
        <rect width="112" height="28" rx="6" fill="#1e293b"/>
        <text x="10" y="18" font-family="'Segoe UI', sans-serif" font-size="10" fill="#e2e8f0">MonthlyIncome</text>
      </g>
      <g transform="translate(122, 60)">
        <rect width="118" height="28" rx="6" fill="#1e293b"/>
        <text x="10" y="18" font-family="'Segoe UI', sans-serif" font-size="10" fill="#e2e8f0">YearsAtCompany</text>
      </g>
    </g>

    <!-- Status footer -->
    <g transform="translate(20, 298)">
      <circle cx="6" cy="6" r="4" fill="#10b981" filter="url(#eaGlow)"/>
      <text x="18" y="10" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="600" fill="#10b981">Trained &amp; Saved Model (Joblib)</text>
    </g>
  </g>
</svg>
